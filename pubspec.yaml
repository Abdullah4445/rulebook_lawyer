name: lawyer
description: Rulebook Lawyer - Professional Legal Services Platform
publish_to: 'none'

version: 6.1.0+105

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase Packages
  firebase_auth: ^5.4.2
  cloud_firestore: ^5.6.3
  firebase_core: ^3.15.2
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^7.1.1
  firebase_messaging: ^15.2.4
  firebase_database: ^11.3.2
  firebase_storage: ^12.4.2
  firebase_analytics: ^11.4.4

  # Other useful packages
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.6
  geocoding: ^4.0.0
  flutter_local_notifications: ^18.0.0
  googleapis_auth: ^2.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  shared_preferences: ^2.4.0
  http: ^1.3.0
  http_parser: ^4.1.2
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  get: ^4.6.6
  pin_code_fields: ^8.0.1
  intl: ^0.20.2
  flutter_easyloading: ^3.0.5
  country_code_picker: ^3.1.0
  google_maps_flutter: ^2.12.2
  flutter_polyline_points: ^2.1.0
  flutter_rating_bar: ^4.0.1
  bottom_picker: ^3.2.0
  flutter_dash: ^1.0.0
  provider: ^6.1.2
  dotted_border: ^3.0.1
  clipboard: ^2.0.2
  file_picker: ^8.0.7
  image_picker: ^1.1.2
  # Phase 2.3 — voice notes
  record: ^5.1.2
  audioplayers: ^6.1.0
  get_thumbnail_video: ^0.7.3
  path_provider: ^2.1.5
  photo_view: ^0.15.0
  video_player: ^2.9.2
  flutter_email_sender: ^7.0.0
  flutter_html: any
  map_launcher: ^3.5.0
  flutter_native_contact_picker: ^0.0.10
  google_maps_place_picker_mb: ^3.1.2
  badges: ^3.1.2
  location: any
  osm_nominatim: ^3.0.1
  flutter_osm_plugin: ^1.4.1

  # Payment
  flutter_stripe: ^11.4.0
  razorpay_flutter: ^1.3.7
  flutter_paypal: ^0.2.1
  in_app_purchase: ^3.2.3
  epayco_dart:
  flutter_credit_card: ^4.1.0

  # Utilities
  flutter_callkit_incoming: ^2.5.3
  permission_handler: ^12.0.1
  device_info_plus: ^11.3.0
  app_settings: ^6.1.1
  fluttertoast: ^8.2.12
  open_settings_plus: ^0.4.0
  wakelock_plus: ^1.3.2
  geolocator: ^10.1.1

  # Icons and Splash
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.5
  payfast_flutter: ^0.0.7

dependency_overrides:
  webview_flutter: ^4.8.0
  http: ^1.3.0
  google_api_headers: ^4.3.3
  package_info_plus: ^8.1.3
  js: ^0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/appicon/
    - assets/icons/
    - assets/audio/
    - assets/

# ✅ Launcher Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/appicon/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/appicon/app_logo2.png"

  web:
    generate: true
    image_path: "assets/appicon/app_logo.png"
    background_color: "#0F172A"
    theme_color: "#C9A227"

  windows:
    generate: true
    image_path: "assets/appicon/app_logo.png"
    icon_size: 128

  macos:
    generate: true
    image_path: "assets/appicon/app_logo.png"

# ✅ Splash Screen Configuration
flutter_native_splash:
  color: "#0F172A"
  color_dark: "#020617"
  image: assets/appicon/lawyer_splash1.png
  image_dark: assets/appicon/lawyer_splash1.png
  android_12:
    color: "#0F172A"
    color_dark: "#020617"
    image: assets/appicon/lawyer_splash1.png
    image_dark: assets/appicon/lawyer_splash1.png
