pluginManagement {
    def flutterSdkPath = {
        def properties = new java.util.Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }
    settings.ext.flutterSdkPath = flutterSdkPath()

    def flutterGradleBuild = file("flutter_tools_gradle")
    if (!flutterGradleBuild.isDirectory()) {
        flutterGradleBuild = new java.io.File(settings.ext.flutterSdkPath, "packages/flutter_tools/gradle")
    }
    assert flutterGradleBuild.isDirectory(), "Flutter Gradle build not found at ${new java.io.File(settings.ext.flutterSdkPath, "packages/flutter_tools/gradle")} or ${file("flutter_tools_gradle")}"

    includeBuild(flutterGradleBuild.absolutePath)

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id 'com.android.application' version '8.11.1' apply false
    id 'com.android.library' version '8.11.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.20' apply false


    // START: FlutterFire Configuration
    id "com.google.gms.google-services" version "4.4.2" apply false
    // END: FlutterFire Configuration
}

include ":app"